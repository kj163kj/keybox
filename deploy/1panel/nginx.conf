worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    keepalive_timeout 60;

    # 1Panel OpenResty runs on the host. Only host gateway addresses may supply
    # the client's forwarding chain; requests from other containers cannot.
    set_real_ip_from 172.18.0.1;
    set_real_ip_from 172.31.26.1;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 1088k;
        client_body_buffer_size 1088k;
        client_body_timeout 10s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~ ^/(api/|healthz$) {
            # Resolve the API on each request so API recreation needs no reload.
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $api_backend http://api:8080;
            proxy_pass $api_backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            proxy_cache off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            proxy_read_timeout 25s;
            proxy_send_timeout 15s;
            # Preserve the API's no-store/nosniff without duplicated headers.
            proxy_hide_header Cache-Control;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
        }
    }
}
